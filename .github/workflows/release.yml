name: Release

# Срабатывает при пуше тега вида v0.1.0.
# Создаёт ЧЕРНОВИК релиза (draft) с бинарниками под Windows и Linux —
# его нужно открыть на GitHub и нажать «Publish» вручную.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (MSVC)
        run: cargo build --release
      - name: Build NSIS installer
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DSRCEXE=target\release\screensnip.exe /DOUTFILE=ScreenSnip-Setup.exe installer\screensnip.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/screensnip.exe
            ScreenSnip-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libpipewire-0.3-dev libgbm-dev libegl-dev libdrm-dev
      - name: Build
        run: cargo build --release
      - name: Rename binary
        run: cp target/release/screensnip screensnip-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: screensnip-linux-x86_64

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            windows/screensnip.exe
            windows/ScreenSnip-Setup.exe
            linux/screensnip-linux-x86_64
